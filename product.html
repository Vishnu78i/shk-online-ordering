<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a71e1e"><title>Menu Item | SHK</title>
<style>
:root{--red:#a71e1e;--green:#2f5c2b;--gold:#d49316;--cream:#fbf7eb;--paper:#fffdf8;--ink:#3a2922;--muted:#766257;--line:#e4ca8f}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,sans-serif;background:linear-gradient(180deg,#fbf7eb,#fffdf8 50%,#f4ead3);min-height:100vh}a{text-decoration:none;color:inherit}.wrap{max-width:1100px;margin:auto;padding:0 22px}
nav{position:sticky;top:0;z-index:20;background:rgba(251,247,235,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{min-height:92px;display:flex;justify-content:space-between;align-items:center}.logo{width:108px;height:82px;object-fit:contain}.links{display:flex;gap:8px;align-items:center}.cart-badge{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;transform-origin:center}.cart-badge.cart-pulse{animation:cartPulse .65s ease}.links a{padding:11px 15px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:1px}.links a:hover{background:#fffaf0;color:var(--red)}
main{padding:52px 0 82px}.crumb{font-size:13px;color:var(--muted);font-weight:800;margin-bottom:18px}.product{display:grid;grid-template-columns:1.08fr .92fr;gap:38px;align-items:center}.image-card{background:var(--paper);border:1px solid var(--line);border-radius:30px;padding:18px;box-shadow:0 25px 58px rgba(76,44,18,.12)}.image-card img{width:100%;height:min(650px,56vw);display:block;object-fit:cover;border-radius:21px;background:#f1dfb9}.eyebrow{font-size:12px;color:var(--green);font-weight:900;letter-spacing:2.5px}.title{font:700 clamp(40px,5.5vw,66px)/1.03 Georgia,serif;color:var(--red);margin:13px 0}.price{display:inline-flex;padding:11px 16px;border-radius:999px;background:#fff0c9;color:#68480d;font-weight:900;font-size:18px}.description{font-size:18px;color:var(--muted);line-height:1.7;margin:20px 0}.detail{border-top:1px solid var(--line);padding-top:20px;margin-top:20px}.detail h2{font:700 28px Georgia,serif;color:var(--red);margin:0 0 9px}.detail p{color:var(--muted);line-height:1.7;margin:0}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.tag{padding:8px 11px;border-radius:999px;background:#edf5e9;color:var(--green);font-size:10px;font-weight:900}.actions{display:flex;gap:11px;margin-top:24px}.btn{flex:1;min-height:52px;border:0;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer}.add{background:linear-gradient(135deg,#bd7b08,#e0a326);color:#fff}.cart{background:var(--green);color:#fff}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--green);color:#fff;padding:13px 18px;border-radius:999px;font-weight:900;transition:.25s;z-index:100}.cart-fly{position:fixed;left:0;top:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#fff;box-shadow:0 12px 25px rgba(76,44,18,.25);z-index:1000;pointer-events:none}.cart-fly svg{width:20px;height:20px}@keyframes cartPulse{0%{transform:scale(1)}35%{transform:scale(1.45)}70%{transform:scale(.88)}100%{transform:scale(1)}}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.product{grid-template-columns:1fr}.image-card img{height:380px}.nav{min-height:78px}.logo{width:80px;height:64px}.links a{font-size:10px;padding:9px}.wrap{padding:0 16px}.actions{flex-direction:column}}
</style></head><body>
<nav><div class="wrap nav"><a href="index.html"><img class="logo" src="assets/shk-logo.svg" alt="Swastik Home Kitchen logo"></a><div class="links"><a href="index.html#menu">MENU</a><a href="about.html">ABOUT</a><a href="cart.html">CART <span id="cartBadge" class="cart-badge">0</span></a></div></div></nav>
<main><div class="wrap"><div class="crumb"><a href="index.html#menu">← Back to menu</a></div><div id="product"></div></div></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="assets/menu.js"></script><script src="assets/premium.js"></script><script>
const item=SHK_MENU.find(x=>x.id===new URLSearchParams(location.search).get('item'))||SHK_MENU[0];
document.title=item.name+' • SHK';
document.querySelector('#product').innerHTML='<div class="product"><div class="image-card"><img src="'+item.image+'" alt="'+item.name+'" onerror="SHK_IMAGE_FALLBACK(this,item.name,item.category)"></div><div><div class="eyebrow">'+item.category.toUpperCase()+' • SWASTIK HOME KITCHEN</div><h1 class="title">'+item.name+'</h1><div class="price">Rs. '+item.price+'</div><p class="description">'+item.short+'</p><div class="detail"><h2>About this dish</h2><p>'+item.about+'</p></div><div class="tags"><span class="tag">FRESHLY PRESENTED</span><span class="tag">SHK HOME KITCHEN</span><span class="tag">'+item.category.toUpperCase()+'</span></div><div class="actions"><button id="add" class="btn add" type="button">ADD TO CART</button><a class="btn cart" href="cart.html">VIEW CART</a></div></div></div>';
function getCart(){try{const x=JSON.parse(localStorage.getItem('shkCart')||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
function updateBadge(){document.querySelector('#cartBadge').textContent=getCart().reduce((s,x)=>s+Math.max(1,Math.floor(Number(x.qty)||1)),0)}
function flyToCart(button){const target=document.querySelector('#cartBadge');if(!button||!target)return;const a=button.getBoundingClientRect(),z=target.getBoundingClientRect(),dot=document.createElement('div');dot.className='cart-fly';dot.innerHTML='<svg viewBox="0 0 24 24" fill="none"><path d="M3.5 4.5h2l1.5 10h10l2-7H6.2M9 19.5h.01M17 19.5h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4M10 10h4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';document.body.appendChild(dot);const a1=a.left+a.width/2-20,b1=a.top+a.height/2-20,a2=z.left+z.width/2-20,b2=z.top+z.height/2-20;dot.style.transform='translate3d('+a1+'px,'+b1+'px,0)';requestAnimationFrame(()=>{dot.animate([{transform:'translate3d('+a1+'px,'+b1+'px,0) scale(1)',opacity:1},{transform:'translate3d('+(a1+(a2-a1)*.5)+'px,'+(b1+(b2-b1)*.25-55)+'px,0) scale(1.1)',opacity:1},{transform:'translate3d('+a2+'px,'+b2+'px,0) scale(.55)',opacity:.15}],{duration:650,easing:'cubic-bezier(.2,.75,.2,1)'}).finished.then(()=>{dot.remove();target.classList.add('cart-pulse');setTimeout(()=>target.classList.remove('cart-pulse'),700)}).catch(()=>dot.remove())})}
function add(){const c=getCart().filter(x=>x&&x.id&&SHK_MENU.some(m=>m.id===x.id)).map(x=>({id:x.id,qty:Math.max(1,Math.floor(Number(x.qty)||1))}));const r=c.find(x=>x.id===item.id);if(r)r.qty++;else c.push({id:item.id,qty:1});localStorage.setItem('shkCart',JSON.stringify(c));updateBadge();flyToCart(document.querySelector('#add'));const t=document.querySelector('#toast');t.textContent=item.name+' added to cart';t.classList.add('show');clearTimeout(window.__p);window.__p=setTimeout(()=>t.classList.remove('show'),1700)}
document.querySelector('#add').addEventListener('click',add);
</script></body></html>
