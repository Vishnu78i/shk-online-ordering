<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a71e1e"><title>Cart | Swastik Home Kitchen</title>
<style>
:root{--red:#8f2232;--green:#355a45;--gold:#c8a15a;--cream:#fbf8f0;--paper:#fffdf8;--ink:#2f2724;--muted:#786b63;--line:#e7d7b5;--ok:#25d366}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#fffef8,#fbf7eb 45%,#f4ead4);min-height:100vh}a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}.wrap{max-width:1060px;margin:auto;padding:0 22px}
nav{position:sticky;top:0;z-index:30;background:rgba(251,247,235,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{min-height:92px;display:flex;justify-content:space-between;align-items:center}.logo{width:108px;height:82px;object-fit:contain}.links{display:flex;gap:8px}.links a{padding:11px 15px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:1px}.links a:hover{background:#fffaf0;color:var(--red)}.cart-link{background:#fff5df;border:1px solid rgba(212,148,22,.25)}.cart-badge{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--red);color:#fff;font-size:11px}
main{padding:55px 0 84px}.kicker{text-align:center;color:var(--green);font-size:12px;font-weight:900;letter-spacing:4px}h1{text-align:center;font:700 clamp(44px,7vw,66px)/1 Georgia,serif;color:var(--red);margin:15px 0 10px}.lead{text-align:center;color:var(--muted);max-width:720px;margin:0 auto 30px;line-height:1.65}
.progress{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:30px;font-size:10px;font-weight:900}.step{padding:8px 12px;border-radius:999px;background:#f0e6d1;color:#8f7868}.step-btn{border:0;font:inherit;cursor:default}.step-btn:disabled{opacity:1}.step.active{background:var(--green);color:#fff}.line{height:1px;width:38px;background:var(--line)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}.panel{background:rgba(255,253,248,.97);border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 55px rgba(76,44,18,.10)}.items-panel{padding:24px}.panel h2{font:700 29px Georgia,serif;color:var(--red);margin:0}.note{font-size:13px;color:var(--muted);line-height:1.5;margin:6px 0 18px}.item-list{display:grid;gap:12px}
.item-card{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px;border:1px solid #ead9b6;background:linear-gradient(#fffdf8,#fff9ef);border-radius:19px}.thumb{width:78px;height:72px;border-radius:14px;overflow:hidden;border:1px solid #e1c67e;background:#f3dfb0}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.item-name{font:700 19px Georgia,serif;color:var(--red);margin:0 0 4px}.item-meta{font-size:12px;color:var(--muted)}.unit{font-size:12px;color:var(--green);font-weight:900;margin-top:4px}
.controls{display:flex;align-items:center;gap:9px}.qty-box{display:flex;align-items:center;gap:8px;padding:5px;border-radius:13px;background:#f7efdf;border:1px solid #e5cf9f}.qty-btn{width:36px;height:36px;border:0;border-radius:10px;background:#fffdf8;color:var(--green);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(76,44,18,.08)}.qty-btn svg,.remove-btn svg{width:17px;height:17px}.qty-value{min-width:26px;text-align:center;font-weight:900}.remove-btn{width:37px;height:37px;border:0;border-radius:10px;background:#fff0ed;color:var(--red);display:grid;place-items:center;cursor:pointer}
.summary-panel{padding:22px;position:sticky;top:112px}.summary-title{font:700 27px Georgia,serif;color:var(--red);margin:0 0 15px}.summary-items{display:grid;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}.summary-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:#fff9ef;border:1px solid #eee0c4}.summary-item-name{font-size:12px;font-weight:900;color:#604a3b;line-height:1.35}.summary-item-meta{display:block;color:var(--green);font-size:10px;font-weight:800;margin-top:3px}.summary-item-total{font-size:12px;font-weight:900;color:var(--ink);white-space:nowrap}.summary-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #eee0c4;font-size:13px}.summary-row:last-of-type{border-bottom:0}.summary-total{display:flex;justify-content:space-between;padding-top:14px;margin-top:5px;border-top:1px solid var(--line);font-weight:900}.total-price{color:var(--green);font-size:21px}.message-label{display:block;margin-top:19px;font-size:11px;letter-spacing:.8px;font-weight:900;color:#604a3b}.message{width:100%;min-height:112px;margin-top:8px;border:1px solid #dccb9c;border-radius:15px;padding:14px;background:#fffdf8;resize:vertical;outline:none}.message:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,148,22,.11)}.primary,.secondary{width:100%;min-height:52px;border-radius:15px;margin-top:12px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}.primary{border:0;background:var(--green);color:#fff}.secondary{border:1px solid var(--line);background:#fff5df;color:var(--red)}.clear{display:flex;justify-content:center;margin-top:13px}.clear button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer}.empty{text-align:center;padding:32px 18px;border:1px dashed var(--line);border-radius:18px;background:#fbf2df;color:var(--muted)}.empty strong{display:block;color:var(--red);font:700 22px Georgia,serif;margin-bottom:6px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--green);color:#fff;padding:13px 18px;border-radius:999px;font-weight:900;transition:.25s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.summary-panel{position:static}.nav{min-height:78px}.logo{width:82px;height:64px}.links a{font-size:10px;padding:9px}.wrap{padding:0 16px}.item-card{grid-template-columns:66px minmax(0,1fr)}.thumb{width:66px;height:62px}.controls{grid-column:1/-1;justify-content:space-between}.progress{gap:5px}.line{width:18px}}
@media(max-width:520px){.items-panel,.summary-panel{padding:18px}.links a:nth-child(2){display:none}}
</style></head><body>
<nav><div class="wrap nav"><a href="index.html"><img class="logo" src="assets/shk-logo-clean.svg" alt="Swastik Home Kitchen logo"></a><div class="links"><a href="index.html#menu">MENU</a><a href="about.html">ABOUT</a><a class="cart-link" href="cart.html">CART</a></div></div></nav>
<main><div class="wrap"><div class="kicker">SWASTIK HOME KITCHEN</div><h1>Your Cart</h1><p class="lead">Adjust quantities, review prices, add a message, and continue to the dedicated checkout page.</p><div class="progress" aria-label="Checkout steps"><button id="cartStep1" class="step step-btn active" type="button" disabled>1 • CART</button><span class="line"></span><button id="cartStep2" class="step step-btn" type="button" disabled>2 • DETAILS</button><span class="line"></span><button id="cartStep3" class="step step-btn" type="button" disabled>3 • WHATSAPP</button></div>
<div class="layout"><section class="panel items-panel"><h2>Selected Items</h2><p class="note">Use − and + to change quantity. The bin button removes a dish completely.</p><div id="cartList" class="item-list"></div></section>
<aside class="panel summary-panel"><h2 class="summary-title">Order Summary</h2><div id="summaryItems" class="summary-items"></div><div class="summary-row"><span>Total dishes</span><strong id="count">0</strong></div><div class="summary-total"><span>Total</span><span id="total" class="total-price">Rs. 0</span></div><label class="message-label" for="message">MESSAGE FOR SHK (OPTIONAL)</label><textarea id="message" class="message" maxlength="400" placeholder="Special request, delivery instruction, or anything else you'd like to tell us."></textarea><button id="checkout" class="primary" type="button">PROCEED TO CHECKOUT</button><a class="secondary" href="index.html#menu">CONTINUE SHOPPING</a><div class="clear"><button id="clear" type="button">Clear all items</button></div></aside></div></div></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div><script src="assets/menu.js"></script><script src="assets/premium.js"></script><script>
const allowed=new Set(SHK_MENU.map(x=>x.id));const byId=Object.fromEntries(SHK_MENU.map(x=>[x.id,x]));
function read(){try{const raw=JSON.parse(localStorage.getItem('shkCart')||'[]');if(!Array.isArray(raw))return[];const merged={};raw.forEach(x=>{if(x&&x.id&&allowed.has(x.id))merged[x.id]=(merged[x.id]||0)+Math.max(1,Math.floor(Number(x.qty)||1))});return Object.entries(merged).map(([id,qty])=>({id,qty}))}catch{return[]}}
function save(c){localStorage.setItem('shkCart',JSON.stringify(c))}
function qty(c){return c.reduce((s,x)=>s+x.qty,0)}
function money(n){return'Rs. '+n.toLocaleString('en-IN')}
function icon(t){if(t==='minus')return'<svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>';if(t==='plus')return'<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>';return'<svg viewBox="0 0 24 24" fill="none"><path d="M9 5h6M5.5 7.5h13M8 10v8m4-8v8m4-8v8M7 7.5l.7 12h8.6l.7-12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function render(){
 const c=read(),list=document.querySelector('#cartList'),sum=document.querySelector('#summaryItems'),n=qty(c);
 const total=c.reduce((s,x)=>s+(byId[x.id]?byId[x.id].price*x.qty:0),0);
 document.querySelector('#count').textContent=n;
 const checkoutButton=document.querySelector('#checkout');
 if(checkoutButton)checkoutButton.style.display=n?'flex':'none';
 document.querySelector('#total').textContent=money(total);
 const badge=document.querySelector('#cartBadge');if(badge)badge.textContent=n;

 if(!c.length){
   list.innerHTML='<div class="empty"><strong>Your cart is empty</strong>Add something delicious from the menu.<br><a href="index.html#menu" style="display:inline-block;margin-top:12px;color:var(--red);font-weight:900">← Browse menu</a></div>';
   if(sum)sum.innerHTML='<div style="font-size:12px;color:var(--muted);padding:6px 0">No items selected yet.</div>';
   return;
 }

 list.innerHTML=c.map(x=>{
   const i=byId[x.id];
   if(!i)return '';
   return '<article class="item-card"><div class="thumb"><img loading="lazy" src="'+i.image+'" alt="'+i.name+'" onerror="SHK_IMAGE_FALLBACK(this,i.name,i.category)"></div><div><h3 class="item-name">'+i.name+'</h3><div class="item-meta">'+i.category+'</div><div class="unit">'+money(i.price)+' each</div></div><div class="controls"><div class="qty-box"><button class="qty-btn" type="button" data-act="minus" data-id="'+i.id+'">'+icon('minus')+'</button><span class="qty-value">'+x.qty+'</span><button class="qty-btn" type="button" data-act="plus" data-id="'+i.id+'">'+icon('plus')+'</button></div><button class="remove-btn" type="button" data-act="remove" data-id="'+i.id+'" title="Remove item" aria-label="Remove '+i.name+'">'+icon('remove')+'</button></div></article>';
 }).join('');

 if(sum){
   sum.innerHTML=c.map(x=>{
     const i=byId[x.id];
     if(!i)return '';
     return '<div class="summary-item"><div><span class="summary-item-name">'+i.name+'</span><span class="summary-item-meta">Rs. '+i.price+' × '+x.qty+'</span></div><span class="summary-item-total">'+money(i.price*x.qty)+'</span></div>';
   }).join('');
 }
}
function toast(m){const t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),1600)}
document.querySelector('#cartList').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const c=read(),r=c.find(x=>x.id===b.dataset.id);if(b.dataset.act==='plus'){r.qty++;save(c);toast('Quantity increased')}else if(b.dataset.act==='minus'){r.qty--;save(r.qty>0?c.filter(x=>x.qty>0):c.filter(x=>x.id!==b.dataset.id));toast(r.qty>0?'Quantity decreased':'Item removed')}else{save(c.filter(x=>x.id!==b.dataset.id));toast('Item removed')}render()});
document.querySelector('#clear').addEventListener('click',()=>{save([]);render();toast('Cart cleared')});document.querySelector('#checkout').addEventListener('click',()=>{const c=read();save(c);localStorage.setItem('shkCartMessage',document.querySelector('#message').value.trim());location.href='checkout.html'});document.querySelector('#message').value=localStorage.getItem('shkCartMessage')||'';render();
</script></body></html>
