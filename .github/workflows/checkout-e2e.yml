name: SHK Checkout E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checkout-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y
      - run: npm install --save-dev @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 --directory . >/tmp/shk-http.log 2>&1 &
      - run: npx playwright test tests/checkout.spec.js --workers=1 --reporter=line
